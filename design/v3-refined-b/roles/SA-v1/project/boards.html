<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Admin Inspection Boards</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
/* Inspection boards: newly authored derivative (not a recovered V3 wrapper). Each frame is the same
   role preview (index.html) opened at a width and route; frames do not share state with each other. */
:root{--bg:#E9EBF3;--ink:#131938;--navy:#141B5E;--muted:#555C7E;--line:#CDD1E1}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/22px 'Public Sans',system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
h1{margin:0 0 6px;font:700 28px/34px 'Public Sans',system-ui,sans-serif;color:var(--navy)}
p{margin:0 0 18px;color:var(--muted);max-width:70em}
label{font-weight:600;margin-right:8px}
select{font:inherit;height:40px;padding:0 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-right:16px}
.row{display:flex;gap:24px;align-items:flex-start;overflow-x:auto;padding:16px 0}
figure{margin:0;flex:none}
figcaption{font-weight:650;color:var(--navy);margin-bottom:8px}
.frame{overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 8px 30px -18px rgba(19,25,56,.4)}
iframe{border:0;transform-origin:0 0;display:block}
</style>
</head>
<body>
<h1>Super Admin · inspection boards</h1>
<p>The same live role preview at the four review widths. Choose a screen and scenario; each frame is independent. Use index.html for the connected journey, where decisions persist across screens.</p>
<div><label for="rt">Screen</label><select id="rt"></select><label for="sc">Scenario</label><select id="sc"><option value="busy">23 Oct 2026 · working day</option><option value="new">8 Oct 2026 · new institution</option><option value="quiet">23 Oct 2026 · nothing waiting</option><option value="konark">23 Oct 2026 · Konark paused</option></select><label for="ls">Lists</label><select id="ls"><option value="">Normal</option><option value="loading">Loading</option><option value="failed">Failed</option><option value="empty">Empty</option></select></div>
<div class="row" id="row"></div>
<script>
const SCREENS=[['SA-01 Overview','#/overview'],['SA-02 Requests','#/requests'],['SA-03 Request decision · renewal','#/requests/hyderabad-renewal'],['SA-03 Request decision · new access','#/requests/godavari-new-access'],['SA-06 Institutions','#/institutions'],['SA-07 Institution detail · active','#/institutions/godavari'],['SA-07 · no Institute Admin','#/institutions/sahyadri'],['SA-07 · paused','#/institutions/deccan'],['SA-07 · ended','#/institutions/malnad'],['SA-10 Content updates','#/content/updates'],['SA-11 Release or hold','#/content/updates/distillation-1-3'],['SA-11 · on hold','#/content/updates/boiler-2-1'],['SA-12 All content','#/content/all'],['SA-13 Content record · stuck','#/content/records/dc-motor'],['SA-13 · published','#/content/records/distillation-column'],['SA-14 Academic structure','#/structure'],['SA-15 Course record','#/structure/courses/me-zg523'],['SA-15 Area record','#/structure/areas/chemical'],['SA-16 Platform roles','#/roles/reviewers'],['SA-17 Role holder','#/roles/holder/k-iyer'],['SA-18 Device transfers','#/operations/device-transfers'],['SA-19 Device transfer decision','#/operations/device-transfers/rahul-verma-vr'],['SA-20 Support reports','#/operations/support'],['SA-21 Support report','#/operations/support/import-part-way'],['SA-22 Access ending','#/operations/access-ending'],['Help & support (XS, borrowed)','#/help']];
const W=[[1440,.42],[1024,.5],[768,.55],[375,.8]], rt=document.getElementById('rt'), sc=document.getElementById('sc'), ls=document.getElementById('ls'), row=document.getElementById('row');
SCREENS.forEach(s=>{const o=document.createElement('option');o.value=s[1];o.textContent=s[0];rt.appendChild(o);});
function draw(){row.innerHTML='';W.forEach(([w,k])=>{const h=1500,f=document.createElement('figure');f.innerHTML='<figcaption>'+w+' px</figcaption><div class="frame" style="width:'+Math.round(w*k)+'px;height:'+Math.round(h*k)+'px"><iframe title="Super Admin preview at '+w+' pixels" style="width:'+w+'px;height:'+h+'px;transform:scale('+k+')" src="index.html?clean=1&scenario='+sc.value+(ls.value?'&list='+ls.value:'')+rt.value+'"></iframe></div>';row.appendChild(f);});}
[rt,sc,ls].forEach(e=>e.addEventListener('change',draw));draw();
</script>
</body>
</html>
