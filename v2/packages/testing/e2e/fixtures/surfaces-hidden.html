<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixture — a selector hidden in a closed menu</title>
    <script>
      window.__note = 'demo text inside a script is code, not rendered copy';
    </script>
  </head>
  <body>
    <main>
      <h1>Help &amp; support</h1>
      <button type="button" aria-expanded="false" aria-controls="menu">Account</button>
      <ul id="menu" hidden>
        <li><a href="#out">Sign out</a></li>
        <li><a href="#switch">Switch account</a></li>
      </ul>
    </main>
  </body>
</html>
