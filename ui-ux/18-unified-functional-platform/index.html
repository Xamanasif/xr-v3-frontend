<!-- ⚠ CACHE-BUSTING TOKEN — bump `?v=` on EVERY line below whenever this
     build is handed to somebody for review.

     WHY THIS EXISTS. These are plain <script src> tags with no build step,
     and the prototype is served by `python3 -m http.server`, which sends
     `Last-Modified` but NO `Cache-Control` and NO `ETag`. Under RFC 9111 a
     browser is then free to reuse a cached copy without revalidating, and
     Safari does. The observed consequence was a reviewer opening the app on
     localhost and reporting features MISSING that were present in the source
     the whole time — the page was executing an older copy of these files
     while the server was serving the new ones. It was reproduced directly:
     the served file contained the new code and `XRSLP.screens` did not.

     A `file://` copy does not show the same symptom (it revalidates by
     mtime), which is why the two origins appeared to run different builds.
     They never did. They also keep SEPARATE localStorage, which is a real
     but different difference — data, not code.

     Bumping this token changes the URL, so the browser cannot serve a stale
     copy for it. While actively editing, a hard reload is still the quicker
     loop. -->
<script src="js/utils.js?v=090"></script>
<script src="js/data.js?v=090"></script>
<script src="js/ai-assist.js?v=090"></script>
<script src="js/state.js?v=090"></script>
<script src="js/csv.js?v=090"></script>
<!-- Implementation 09. First-party spreadsheet support (no third-party parser,
     no CDN - see the header of js/xlsx.js). question-import.js reads BOTH
     formats, so it loads after csv.js and xlsx.js. -->
<script src="js/xlsx.js?v=090"></script>
<script src="js/question-import.js?v=090"></script>
<script src="js/components.js?v=090"></script>
<!-- Shared content-production UI. Loads after components.js (it builds on
     XRSLP.ui) and before the three content workspaces that consume it. -->
<script src="js/content-ui.js?v=090"></script>
<!-- Shared Help / support surface (Implementation 06). One
     implementation, used by every workspace that has a Help
     destination. Loads after components.js. -->
<script src="js/support-ui.js?v=090"></script>
<script src="js/router.js?v=090"></script>
<script src="js/screens/public-catalogue.js?v=090"></script>
<script src="js/screens/public-request.js?v=090"></script>
<!-- Super Admin workspace — three files, ONE workspace.
     platform.js declares XRSLP.platformUI, so it loads first. -->
<script src="js/screens/platform.js?v=090"></script>
<script src="js/screens/platform-content.js?v=090"></script>
<script src="js/screens/platform-ops.js?v=090"></script>
<script src="js/screens/tenant.js?v=090"></script>
<script src="js/screens/tenant-people.js?v=090"></script>
<script src="js/screens/tenant-groups.js?v=090"></script>
<script src="js/screens/tenant-assign.js?v=090"></script>
<!-- Implementation 07.2 — the Tenant Admin is the institution's point of
     contact for device replacement / transfer requests. Loads after
     tenant.js, whose href map and requireTenant guard it uses. -->
<script src="js/screens/tenant-ops.js?v=090"></script>
<script src="js/screens/student.js?v=090"></script>
<script src="js/screens/student-learn.js?v=090"></script>
<!-- Student operational screens (Implementation 06): My device and Help. -->
<script src="js/screens/student-ops.js?v=090"></script>
<!-- Faculty loads after the Student screens: the Faculty preview renders
     through XRSLP.studentUI, so that module must exist first. -->
<script src="js/screens/faculty.js?v=090"></script>
<script src="js/screens/faculty-assess.js?v=090"></script>
<!-- Implementation 05 — the content production chain:
     Vendor → Academic Reviewer → Content Manager → Published. -->
<script src="js/screens/vendor.js?v=090"></script>
<script src="js/screens/reviewer.js?v=090"></script>
<script src="js/screens/content-manager.js?v=090"></script>
<!-- Implementation 06 — later-version screens for the Vendor and the
     Academic Reviewer, and the shared Help destination for the five
     workspaces that are not the Student. Both load after the
     workspaces whose UI helpers they use. -->
<script src="js/screens/content-version.js?v=090"></script>
<script src="js/screens/workspace-help.js?v=090"></script>
<script src="js/app.js?v=090"></script>
</body>
