<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XR Simulation Learning Platform (Prototype)</title>
<meta name="description" content="Unified functional prototype — public catalogue to institutional access vertical slice. Sample data only.">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="app-root"></div>
<div id="dialog-root"></div>
<div class="toasts" id="toasts"></div>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
<noscript>
  <div style="max-width:640px;margin:60px auto;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif">
    <h1 style="font-size:20px">XR Simulation Learning Platform — prototype</h1>
    <p>This functional prototype needs JavaScript to run. Please enable JavaScript and reload the page.</p>
  </div>
</noscript>
<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/ai-assist.js"></script>
<script src="js/state.js"></script>
<script src="js/csv.js"></script>
<script src="js/components.js"></script>
<!-- Shared content-production UI. Loads after components.js (it builds on
     XRSLP.ui) and before the three content workspaces that consume it. -->
<script src="js/content-ui.js"></script>
<!-- Shared Help / support surface (Implementation 06). One
     implementation, used by every workspace that has a Help
     destination. Loads after components.js. -->
<script src="js/support-ui.js"></script>
<script src="js/router.js"></script>
<script src="js/screens/public-catalogue.js"></script>
<script src="js/screens/public-request.js"></script>
<!-- Super Admin workspace — three files, ONE workspace.
     platform.js declares XRSLP.platformUI, so it loads first. -->
<script src="js/screens/platform.js"></script>
<script src="js/screens/platform-content.js"></script>
<script src="js/screens/platform-ops.js"></script>
<script src="js/screens/tenant.js"></script>
<script src="js/screens/tenant-people.js"></script>
<script src="js/screens/tenant-groups.js"></script>
<script src="js/screens/tenant-assign.js"></script>
<script src="js/screens/student.js"></script>
<script src="js/screens/student-learn.js"></script>
<!-- Student operational screens (Implementation 06): My device and Help. -->
<script src="js/screens/student-ops.js"></script>
<!-- Faculty loads after the Student screens: the Faculty preview renders
     through XRSLP.studentUI, so that module must exist first. -->
<script src="js/screens/faculty.js"></script>
<script src="js/screens/faculty-assess.js"></script>
<!-- Implementation 05 — the content production chain:
     Vendor → Academic Reviewer → Content Manager → Published. -->
<script src="js/screens/vendor.js"></script>
<script src="js/screens/reviewer.js"></script>
<script src="js/screens/content-manager.js"></script>
<!-- Implementation 06 — later-version screens for the Vendor and the
     Academic Reviewer, and the shared Help destination for the five
     workspaces that are not the Student. Both load after the
     workspaces whose UI helpers they use. -->
<script src="js/screens/content-version.js"></script>
<script src="js/screens/workspace-help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
